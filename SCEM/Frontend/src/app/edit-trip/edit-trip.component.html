<div class="edit-trip-page">@if(!trip){<div class="not-found-card"><h1>Trip not found</h1><a routerLink="/trips" class="primary-btn">Back to Trips</a></div>}@else{<a [routerLink]="['/trips',trip.id]" class="back-link">← Back to Trip</a><div class="edit-header"><div><span class="section-label">TRIP</span><h1>Edit Trip</h1><p>Update trip details.</p></div></div><div class="edit-layout"><div class="edit-form-card"><div class="form-group"><label>Vehicle</label><select [(ngModel)]="selectedLicensePlate">@for(v of vehicles;track v.licensePlate){<option [value]="v.licensePlate">{{v.name}}</option>}</select></div><div class="form-group"><label>Driver</label><input [(ngModel)]="driver"></div><div class="form-row"><div class="form-group"><label>Start Location</label><input [(ngModel)]="startLocation"></div><div class="form-group"><label>Destination</label><input [(ngModel)]="destination"></div></div><div class="form-group"><label>Date</label><input type="date" [(ngModel)]="tripDate"></div><div class="form-row"><div class="form-group"><label>Start Time</label><input type="time" [(ngModel)]="startTime"></div><div class="form-group"><label>End Time</label><input type="time" [(ngModel)]="endTime"></div></div><div class="form-group"><label>Start Mileage</label><input type="number" [(ngModel)]="startMileage"></div><div class="form-group"><label>Status</label><select [(ngModel)]="status"><option>Planned</option><option>Active</option><option>Completed</option><option>Cancelled</option></select></div><div class="form-group"><label>Notes</label><textarea [(ngModel)]="notes"></textarea></div>@if(errorMessage){<div class="form-error">{{errorMessage}}</div>}<div class="form-actions"><a [routerLink]="['/trips',trip.id]" class="cancel-btn">Cancel</a><button class="save-btn" (click)="saveChanges()">Save Changes</button></div></div><div class="preview-card"><span class="preview-label">LIVE PREVIEW</span>@if(selectedVehicle){<img [src]="selectedVehicle.image"><h2>{{selectedVehicle.name}}</h2><span class="plate">{{selectedVehicle.licensePlate}}</span>}<div class="preview-route"><strong>{{startLocation}}</strong><span>→</span><strong>{{destination}}</strong></div><div class="preview-status">{{status}}</div></div></div>}
</div>
